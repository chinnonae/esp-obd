[env:ioxesp32]
platform = espressif32
board = ioxesp32
framework = arduino

build_unflags = -std=gnu++11
build_flags = -std=gnu++17

monitor_speed = 115200

; Fast, hardware-free tests for portable code only (can/, isotp/,
; diagnostic/, elm/, app/) -- no Arduino, TWAI, or Bluetooth headers.
; See test/README.md. Run with: pio test -e native_test
[env:native_test]
platform = native
; Uses the zig cc/c++/ar drivers bundled in .venv (ziglang pip package) as
; the host compiler, since this project doesn't assume a separately
; installed gcc/g++ toolchain. See test/native_toolchain.py.
extra_scripts = pre:test/native_toolchain.py
build_flags =
    -std=gnu++17
    -Iinclude
test_build_src = true
build_src_filter =
    -<*>
    +<can/>
    +<elm/>
    +<isotp/>
; Later portable layers (diagnostic/, app/) are added to this filter as
; their tasks land. src/main.cpp and platform/esp32/ must never be added
; here -- they require Arduino/ESP-IDF headers this env doesn't have.
