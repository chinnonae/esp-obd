<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ESP-OBD Dashboard</title>
  <meta name="theme-color" content="#101418" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon-192.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon-192.svg" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <header class="app-header">
    <h1 class="app-title">ESP-OBD</h1>
    <div class="header-status">
      <div id="protocol-status" class="protocol-status" title="CAN Protocol">—</div>
      <div class="connection">
        <label class="sim-toggle">
          <input type="checkbox" id="simulator-toggle" />
          Simulator
        </label>
        <span id="connection-status" class="status status--disconnected">Disconnected</span>
        <button id="connect-button" type="button">Connect</button>
      </div>
    </div>
  </header>

  <nav class="tab-bar" role="tablist">
    <button class="tab-button" data-tab="current" role="tab" aria-selected="true">Current</button>
    <button class="tab-button" data-tab="timeseries" role="tab" aria-selected="false">Timeseries</button>
    <button class="tab-button" data-tab="console" role="tab" aria-selected="false">Console</button>
    <button class="tab-button" data-tab="config" role="tab" aria-selected="false">Config</button>
  </nav>

  <main class="views">
    <section id="view-current" class="view" data-view="current"></section>
    <section id="view-timeseries" class="view" data-view="timeseries" hidden></section>
    <section id="view-console" class="view" data-view="console" hidden></section>
    <section id="view-config" class="view" data-view="config" hidden></section>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
